<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecEoKnight</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    .header {
      background: linear-gradient(135deg, #0f3460, #16213e);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #0f3460;
    }
    .header img  { width: 32px; height: 32px; }
    .header-text h1 { font-size: 15px; color: #fff; font-weight: bold; }
    .header-text p  { font-size: 11px; color: #8899aa; margin-top: 1px; }

    .status-row {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #222244;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .dot.green  { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
    .dot.red    { background: #e74c3c; box-shadow: 0 0 6px #e74c3c; }
    .dot.yellow { background: #f39c12; box-shadow: 0 0 6px #f39c12; }
    .status-label { flex: 1; font-size: 13px; }
    .status-label small { display: block; font-size: 11px; color: #8899aa; margin-top: 2px; }

    .stats {
      padding: 12px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      border-bottom: 1px solid #222244;
    }
    .stat-box {
      background: #16213e;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
    }
    .stat-box .num  { font-size: 22px; font-weight: bold; color: #e74c3c; }
    .stat-box .lbl  { font-size: 11px; color: #8899aa; margin-top: 2px; }

    .section {
      padding: 10px 16px;
      border-bottom: 1px solid #222244;
    }
    .section-title {
      font-size: 11px;
      color: #8899aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .server-info {
      font-size: 12px;
      color: #b0b8c8;
      line-height: 1.8;
    }
    .server-info span { color: #4fc3f7; font-family: monospace; }

    .footer {
      padding: 10px 16px;
      font-size: 11px;
      color: #556677;
      text-align: center;
    }

    #loading { padding: 20px; text-align: center; color: #8899aa; }

    .settings-toggle {
      width: 100%;
      background: none;
      border: none;
      color: #4fc3f7;
      font-size: 12px;
      text-align: left;
      padding: 4px 0;
      cursor: pointer;
      font-family: inherit;
    }
    .settings-panel { display: none; margin-top: 8px; }
    .settings-panel label {
      display: block;
      font-size: 11px;
      color: #8899aa;
      margin-top: 8px;
      margin-bottom: 3px;
    }
    .settings-panel input {
      width: 100%;
      background: #0f1729;
      border: 1px solid #2a3a55;
      color: #e0e0e0;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 12px;
      font-family: monospace;
      box-sizing: border-box;
    }
    .settings-panel input:focus { outline: none; border-color: #4fc3f7; }
    .settings-save {
      width: 100%;
      margin-top: 10px;
      background: #2ecc71;
      border: none;
      color: #0f1729;
      font-weight: bold;
      padding: 7px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .settings-save:hover { background: #27ae60; }
    .settings-status { font-size: 11px; margin-top: 6px; min-height: 14px; }
  </style>
</head>
<body>

  <div class="header">
    <img src="icons/icon48.png" alt="SecEoKnight">
    <div class="header-text">
      <h1>SecEoKnight</h1>
      <p>URL Filtering &amp; Threat Detection</p>
    </div>
  </div>

  <div id="loading">Checking server…</div>

  <div id="content" style="display:none">

    <div class="status-row">
      <div class="dot" id="server-dot"></div>
      <div class="status-label">
        <div id="server-status-text">Checking…</div>
        <small id="server-status-sub"></small>
      </div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="num" id="stat-blocks">—</div>
        <div class="lbl">Blocks (This PC)</div>
      </div>
      <div class="stat-box">
        <div class="num" id="stat-ai" style="color:#e67e22">—</div>
        <div class="lbl">AI Detections (This PC)</div>
      </div>
    </div>
    <div style="padding:0 16px 8px;font-size:10px;color:#556677;text-align:center">
      This machine only — see the SIEM dashboard for fleet-wide totals
    </div>

    <div class="section">
      <div class="section-title">Server</div>
      <div class="server-info">
        IP: <span id="info-ip">—</span><br>
        Port: <span id="info-port">—</span><br>
        AI Models: <span id="info-models">—</span>
      </div>

      <button class="settings-toggle" id="settings-toggle">⚙ Change Server ▾</button>
      <div class="settings-panel" id="settings-panel">
        <label for="settings-ip">Server IP or hostname</label>
        <input type="text" id="settings-ip" placeholder="192.168.1.63">
        <label for="settings-port">Port</label>
        <input type="text" id="settings-port" placeholder="5001">
        <button class="settings-save" id="settings-save">Save &amp; Reconnect</button>
        <div class="settings-status" id="settings-status"></div>
      </div>
    </div>

  </div>

  <div class="footer">SecEoKnight Security &copy; 2024</div>

  <script src="popup.js"></script>
</body>
</html>
