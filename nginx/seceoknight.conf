# SecEoKnight — Nginx Reverse Proxy Configuration
# =================================================
# Install:
#   sudo cp nginx/seceoknight.conf /etc/nginx/sites-available/seceoknight
#   sudo ln -s /etc/nginx/sites-available/seceoknight /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# After this, everything is accessible via port 80 (no :5001 needed):
#   Endpoints connect to  http://192.168.1.189/blocklist
#                         http://192.168.1.189/logs
#   Dashboard connects to http://192.168.1.189/api/...
#                         ws://192.168.1.189/ws/alerts
# =================================================

server {
    listen 80;
    server_name _;          # Accepts any hostname — change to your IP if you prefer

    client_max_body_size 20M;   # Allow up to 20 MB uploads (malware image scans)

    # ── Blocklist — endpoint agents fetch this every 30s ──────────────────────
    location /blocklist {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # ── Log receiver — to-server.py on each endpoint POSTs here ───────────────
    location /logs {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # ── AI predictions — Chrome extension calls these ─────────────────────────
    location /predict/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;     # AI inference can take a moment
    }

    # ── REST API — dashboard reads events, stats, blocklist ───────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── WebSocket — real-time alerts to dashboard ──────────────────────────────
    # IMPORTANT: WebSocket requires special headers for the protocol upgrade.
    location /ws/ {
        proxy_pass              http://127.0.0.1:5001;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade    $http_upgrade;
        proxy_set_header        Connection "upgrade";
        proxy_set_header        Host       $host;
        proxy_set_header        X-Real-IP  $remote_addr;
        proxy_read_timeout      3600s;     # Keep WS connection alive for 1 hour
        proxy_send_timeout      3600s;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
        proxy_read_timeout 5s;
    }

    # ── Model status ──────────────────────────────────────────────────────────
    location /models/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
        proxy_read_timeout 5s;
    }

    # ── PAC file — endpoint proxy auto-config (fail-open: DIRECT if proxy down) ──
    location = /proxy.pac {
        alias      /opt/seceoknight/seceoknight-url-filter/server/proxy.pac;
        types      { }
        default_type application/x-ns-proxy-autoconfig;
        add_header Cache-Control "no-cache, no-store";
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
    add_header X-XSS-Protection        "1; mode=block";
}
